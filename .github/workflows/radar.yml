name: PokeRadar

# Each run scans every 3 minutes for ~50 minutes, then starts the next run
# itself. GitHub's cron scheduler is unreliable (it can skip hours), so the
# schedule below is only a backstop to restart the chain if it ever breaks.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: pokeradar
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the run start the next run

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remember which stories were already alerted between runs
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Scan every 3 minutes for 50 minutes (Pokémon + AI radars side by side)
        run: |
          timeout 50m python radar.py --state state/state.json --loop 180 > poke.log 2>&1 &
          if [ -n "$NTFY_TOPIC_AI" ] || [ -n "$DISCORD_WEBHOOK_URL_AI" ]; then
            timeout 50m python radar.py --config config-ai.json --state state/ai.json --loop 180 > ai.log 2>&1 &
          fi
          wait || true
          echo "===== Pokémon radar ====="; cat poke.log
          if [ -f ai.log ]; then echo "===== AI radar ====="; cat ai.log; fi
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC_AI: ${{ secrets.NTFY_TOPIC_AI }}
          DISCORD_WEBHOOK_URL_AI: ${{ secrets.DISCORD_WEBHOOK_URL_AI }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Start the next run
        if: ${{ !cancelled() }}   # cancel a run in the Actions tab to stop the radar
        run: gh workflow run radar.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
